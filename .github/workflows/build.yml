name: build

# 推 main / 提 PR：跑单元测试、构建 Universal 版并打成 DMG。
# 推 v* 标签：再由单独的 release 任务建 Release（只有它有 contents: write）。
on:
  push:
    branches: [main, cursor/review-fixes-712d]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 用 runner 上最新的 Xcode：本地开发用的是新版编译器，旧版对某些表达式会类型推断超时。
      - name: 工具链
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version && xcrun --show-sdk-version

      - name: 单元测试
        run: scripts/test.sh

      - name: 构建（Universal、ad-hoc 签名）
        run: scripts/build-app.sh release

      - name: 打 DMG 并检查签名
        run: |
          set -euo pipefail
          scripts/make-dmg.sh
          dmg=$(ls build/Loupe-*.dmg)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          # 整包签名不完整时，别的 Mac 下载后会提示「已损坏」，而且没有「仍要打开」
          codesign --verify --deep --strict "$mnt/Loupe.app"
          codesign -dvv "$mnt/Loupe.app" 2>&1 | grep -q "Sealed Resources version=2"
          lipo -archs "$mnt/Loupe.app/Contents/MacOS/Loupe" | grep -q "x86_64 arm64\|arm64 x86_64"
          hdiutil detach -quiet "$mnt"
          echo "DMG 体积：$(du -h "$dmg" | cut -f1)"

      - name: 渲染器端到端
        run: python3 scripts/verify-renderers.py

      - name: Intel 切片探测
        run: |
          set -euo pipefail
          bin="build/app.noindex/Loupe.app/Contents/MacOS/Loupe"
          if ! arch -x86_64 /usr/bin/true; then
            echo "::warning::此 runner 不能运行 x86_64（没有 Rosetta），跳过 Intel 切片探测"
            exit 0
          fi
          out=$(arch -x86_64 "$bin" --probe fixtures/text/empty.txt)
          echo "$out"
          echo "$out" | grep -q '"engine":"TextKit"'

      - name: 公证钩子（无凭据时跳过）
        run: scripts/notarize.sh

      - name: 标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Sources/Loupe/Info.plist)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "::error::Info.plist 是 $ver，标签是 $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Loupe-dmg
          path: build/Loupe-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Loupe-dmg
          path: out

      # 说明 = docs/releases/<标签>.md（这一版改了什么）+ DMG 体积 + 固定的安装提示。
      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dmg=$(ls out/Loupe-*.dmg)
          size=$(du -h "$dmg" | cut -f1)
          ( cd out && shasum -a 256 ./* > SHA256SUMS.txt && cat SHA256SUMS.txt )
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || echo "::warning::没有 $notes，发布说明只有安装提示"
          {
            if [ -f "$notes" ]; then cat "$notes"; printf '\n---\n\n'; fi
            echo "DMG 体积：${size}"
            printf '\n'
            cat <<'NOTE'
          Universal（Apple Silicon + Intel），macOS 14 起。校验和见 SHA256SUMS.txt。

          **未经 Apple 公证**：首次打开走「系统设置 › 隐私与安全性 › 仍要打开」，或在「应用程序」里右键 Loupe → 打开。
          NOTE
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Loupe ${GITHUB_REF_NAME#v}" \
            --latest \
            --notes-file release-notes.md
